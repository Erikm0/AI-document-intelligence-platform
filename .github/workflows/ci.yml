name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend - lint, types, tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (without ML extras - tests use in-process fakes)
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app tests evaluation
      - name: Ruff format
        run: ruff format --check app tests evaluation
      - name: Mypy
        run: mypy app
      - name: Unit, integration, evaluation & hallucination tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  backend-postgres:
    name: Backend - integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docintel" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel_test
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Alembic migrations apply cleanly and match the ORM models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Integration tests against PostgreSQL
        run: pytest tests/integration -m integration

  retrieval-eval:
    name: Retrieval evaluation (real models)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/core/config.py') }}
      - name: Install CPU PyTorch + ML extras
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]"
      - name: Quality gate (bge-small + MiniLM cross-encoder + ChromaDB)
        env:
          RUN_ML_EVAL: "1"
        run: pytest -m "ml or chroma" -v
      - name: Evaluation report
        run: |
          python -m evaluation.run --models real --out evaluation/reports
          cat evaluation/reports/eval-real-fake.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: backend/evaluation/reports/

  frontend:
    name: Frontend - types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images & compose config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          build-args: PRELOAD_MODELS=false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
