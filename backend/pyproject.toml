[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-backend"
version = "1.0.0"
description = "AI Document Intelligence Platform - RAG backend (FastAPI, ChromaDB, Sentence Transformers, Ollama)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy ML / vector-store dependencies. Imported lazily so that the API and the
# test-suite can run without them (tests use deterministic in-process fakes).
ml = [
    "sentence-transformers>=3.0,<7",
    "chromadb>=1.0,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that exercise the HTTP API end-to-end with fakes",
    "evaluation: retrieval-quality and hallucination evaluation suites",
    "chroma: requires the chromadb package",
    "ml: requires sentence-transformers models (downloads weights)",
    "live: requires a running Ollama server",
]
filterwarnings = [
    "ignore::DeprecationWarning:pypdf.*",
]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF001"]
# Unicode punctuation is matched on purpose by the text-cleaning code.
"app/ingestion/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic/"]
